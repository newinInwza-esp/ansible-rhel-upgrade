---
- hosts: all
  become: true
  tasks:
    - name: Unmount DH_Front_End
      ansible.builtin.mount:
        path: "{{ item }}"
        state: unmounted
      loop:
        - /usr1/NAS
        - /3dex_data
      when: "'DH_Front_End' in group_names"

    - name: Unmount DH_Back_End
      ansible.builtin.mount:
        path: "{{ item }}"
        state: unmounted
      loop:
        - /usr1/NAS
      when: "'DH_Back_End' in group_names"

    - name: Unmount DH_Customize_DB
      ansible.builtin.mount:
        path: "{{ item }}"
        state: unmounted
      loop: []
      when: "'DH_Customize_DB' in group_names"

    - name: Unmount WBDM
      ansible.builtin.mount:
        path: "{{ item }}"
        state: unmounted
      loop:
        - /appshare01
        - /appshare02
      when: "'WBDM' in group_names"

    - name: Unmount Internal
      ansible.builtin.mount:
        path: "{{ item }}"
        state: unmounted
      loop:
        - /appshare01
        - /appshare02
        - /usr1/NAS
      when: "'Internal' in group_names"

    - name: Unmount Space
      ansible.builtin.mount:
        path: "{{ item }}"
        state: unmounted
      loop:
        - /appshare01
        - /appshare02
        - /usr1/NAS
      when: "'Space' in group_names"

    - name: Unmount passport_dashboard
