---
- hosts: all
  become: true
  tasks:
    - name: Check Mount DH_Front_End
      ansible.builtin.shell:
        cmd: "mount | grep -i '{{ item }}'"
      register: result
      failed_when: result.rc != 0
      loop:
        - /usr1/NAS
        - /3dex_data
      when: "'DH_Front_End' in group_names"

    - name: Check Mount DH_Back_End
      ansible.builtin.shell:
        cmd: "mount | grep -i '{{ item }}'"
