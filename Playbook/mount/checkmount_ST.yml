---
- hosts: all
  become: true
  tasks:
    - name: Check Mount Internal
      ansible.builtin.shell:
        cmd: "mount | grep -i '{{ item }}'"
      register: result
      failed_when: result.rc != 0
      loop:
        - /sys
        - /proc
        - /dev
      when: "'Internal' in group_names"

    - name: Check Mount Space
      ansible.builtin.shell:
        cmd: "mount | grep -i '{{ item }}'"
      register: result
      failed_when: result.rc != 0
      loop:
        - /sys
        - /proc
        - /dev
      when: "'Space' in group_names"

    - name: Check Mount passport_dashboard
