---
- hosts: all
  become: true
  tasks:
    - name: Mount DH_Front_End
      ansible.builtin.mount:
        path: "{{ item }}"
        state: mounted
      loop:
        - /usr1/NAS
        - /3dex_data
      when: "'DH_Front_End' in group_names"

    - name: Mount DH_Back_End
      ansible.builtin.mount:
        path: "{{ item }}"
        state: mounted
      loop:
        - /usr1/NAS
      when: "'DH_Back_End' in group_names"

    - name: Mount DH_Customize_DB
      ansible.builtin.mount:
        path: "{{ item }}"
        state: mounted
      loop: []
      when: "'DH_Customize_DB' in group_names"

    - name: Mount WBDM
      ansible.builtin.mount:
        path: "{{ item }}"
        state: mounted
      loop:
        - /appshare01
        - /appshare02
      when: "'WBDM' in group_names"

    - name: Mount Internal
      ansible.builtin.mount:
        path: "{{ item }}"
        state: mounted
      loop:
        - /appshare01
        - /appshare02
        - /usr1/NAS
      when: "'Internal' in group_names"

    - name: Mount Space
      ansible.builtin.mount:
        path: "{{ item }}"
        state: mounted
      loop:
        - /appshare01
        - /appshare02
        - /usr1/NAS
      when: "'Space' in group_names"

    - name: Mount passport_dashboard
      ansible.builtin.mount:
        path: "{{ item }}"
        state: mounted
      loop:
        - /usr1/NAS
      when: "'passport_dashboard' in group_names"

    - name: Mount 3Dsearch
      ansible.builtin.mount:
        path: "{{ item }}"
        state: mounted
      loop:
        - /usr1/NAS
      when: "'3Dsearch' in group_names"

    - name: Mount Builder
      ansible.builtin.mount:
        path: "{{ item }}"
        state: mounted
      loop:
        - /usr1/NAS
        - /3dex_data_NAS
      when: "'Builder' in group_names"

    - name: Mount Search
      ansible.builtin.mount:
        path: "{{ item }}"
        state: mounted
      loop:
        - /usr1/NAS
        - /3dex_data_NAS
      when: "'Search' in group_names"

    - name: Mount crawler
      ansible.builtin.mount:
        path: "{{ item }}"
        state: mounted
      loop:
        - /usr1/NAS
      when: "'crawler' in group_names"

    - name: Mount 3DComment
      ansible.builtin.mount:
        path: "{{ item }}"
        state: mounted
      loop:
        - /usr1/NAS
        - /3dex_data
      when: "'3DComment' in group_names"

    - name: Mount 3DNotification
      ansible.builtin.mount:
        path: "{{ item }}"
        state: mounted
      loop:
        - /usr1/NAS
      when: "'3DNotification' in group_names"

    - name: Mount 3DSwym
      ansible.builtin.mount:
        path: "{{ item }}"
        state: mounted
      loop:
        - /usr1/NAS
        - /3dswym_data
      when: "'3DSwym' in group_names"

    - name: Mount 3DIndex
      ansible.builtin.mount:
        path: "{{ item }}"
        state: mounted
      loop:
        - /usr1/NAS
      when: "'3DIndex' in group_names"

    - name: Mount 3DSwymIndex
      ansible.builtin.mount:
        path: "{{ item }}"
        state: mounted
      loop:
        - /usr1/NAS
        - /3dswym_data
      when: "'3DSwymIndex' in group_names"

    - name: Mount FCS
      ansible.builtin.mount:
        path: "{{ item }}"
        state: mounted
      loop:
        - /usr1/NAS
        - /3dex_data
      when: "'FCS' in group_names"

    - name: Mount Onepart
      ansible.builtin.mount:
        path: "{{ item }}"
        state: mounted
      loop: []
      when: "'Onepart' in group_names"

    - name: Mount Backup_MRTG
      ansible.builtin.mount:
        path: "{{ item }}"
        state: mounted
      loop: []
      when: "'Backup_MRTG' in group_names"

    - name: Mount BEV_Front_End
      ansible.builtin.mount:
        path: "{{ item }}"
        state: mounted
      loop:
        - /usr1/NAS
        - /3dex_data
      when: "'BEV_Front_End' in group_names"

    - name: Mount BEV_Back_End
      ansible.builtin.mount:
        path: "{{ item }}"
        state: mounted
      loop:
        - /usr1/NAS
      when: "'BEV_Back_End' in group_names"

    - name: Mount C4_Front_End
      ansible.builtin.mount:
        path: "{{ item }}"
        state: mounted
      loop:
        - /usr1/NAS
        - /3dex_data
      when: "'C4_Front_End' in group_names"

    - name: Mount C4_Back_End
      ansible.builtin.mount:
        path: "{{ item }}"
        state: mounted
      loop:
        - /usr1/NAS
      when: "'C4_Back_End' in group_names"

    - name: Mount THEAI
      ansible.builtin.mount:
        path: "{{ item }}"
        state: mounted
      loop:
        - /
      when: "'THEAI' in group_names"