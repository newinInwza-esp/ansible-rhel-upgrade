---
- hosts: all    
  gather_facts: false  # ปิดการกวาดข้อมูลระบบ เพื่อไม่ให้ติด Timeout เครื่องอื่น    # คงไว้ตามที่คุณต้องการ
  become: true      # ใส่ไว้เพื่อให้ย้ายไปใช้สิทธิ์ root / oracle_user ได้

  vars_files:
  - "inventory/ST_1/group_vars/all.yml"
  tasks:
    - name: Check Mount C4_Back_End
      ansible.builtin.shell:
        cmd: "mount | grep -i '{{ item }}'"
      become_user: "{{ oracle_user }}"
      register: result
      failed_when: result.rc != 0
      loop:
        - /
        - /proc
      when: "'ST1_Internal' in group_names"