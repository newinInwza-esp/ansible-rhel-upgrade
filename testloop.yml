---
- hosts: all
  become: true
  become_user: "{{ oracle_user }}"  # สั่งสลับไปรันด้วยสิทธิ์ x3ds

  vars_files:
    - "../../inventory/RE/group_vars/all.yml"
    #- "../../inventory/ST/group_vars/all.yml"

  tasks:
    - name: Check Mount C4_Back_End
      ansible.builtin.shell:
        cmd: "mount | grep -i '{{ item }}'"
      register: result
      failed_when: result.rc != 0
      loop:
        - /
        - /proc
      when: "'C4_Back_End' in group_names"