---
- hosts: all        # คงไว้ตามที่คุณต้องการ
  become: true      # ใส่ไว้เพื่อให้ย้ายไปใช้สิทธิ์ root / oracle_user ได้

  vars_files:
    - "../../inventory/RE/group_vars/all.yml"

  tasks:
    - name: Check Mount C4_Back_End
      ansible.builtin.shell:
        cmd: "mount | grep -i '{{ item }}'"
      become_user: "{{ oracle_user }}"
      register: result
      failed_when: result.rc != 0
      loop:
        - /
        - /proc
      when: "'C4_Back_End' in group_names"