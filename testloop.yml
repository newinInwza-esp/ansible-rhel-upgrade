---
- hosts: all    
  gather_facts: false  
  become: true     

  vars_files:
  - "inventory/ST_1/group_vars/all.yml"
  tasks:
    - name: Check connect and command
      ansible.builtin.shell:
        cmd: "mount | grep -i '{{ item }}'"
      become_user: "{{ oracle_user }}"
      register: result
      failed_when: result.rc != 0
      loop:
        - /mnt
      when: "'Internal' in group_names"

    - name: Unmount Internal
      ansible.builtin.mount:
        path: "{{ item }}"
        state: unmounted
      loop:
        - /mnt
      when: "'Internal' in group_names"
